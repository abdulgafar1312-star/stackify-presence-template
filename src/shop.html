<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — {{business_name}}</title>
<meta name="description" content="Shop online at {{business_name}}.">
<link rel="stylesheet" href="/styles.css">
<style>
  :root { --brand: {{brand_color}}; --accent: {{accent_color}}; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/">{{business_name}}</a>
    <nav aria-label="Primary">
      <a href="/">Home</a>
      <a href="#track">Track order</a>
      <a href="#" id="cart-link">Cart <span class="cart-count" id="cart-count">0</span></a>
    </nav>
  </div>
</header>

<main id="main">
  <section class="section">
    <div class="container">
      <h1>Shop</h1>
      <p class="lede" id="shop-status" role="status">Loading products…</p>
      <div class="cards" id="product-grid"></div>
    </div>
  </section>

  <section class="section section-alt">
    <div class="container">
      <h2>Your cart</h2>
      <div id="cart-empty" class="muted">Your cart is empty.</div>
      <div id="cart-panel" hidden>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr></thead>
            <tbody id="cart-body"></tbody>
            <tfoot>
              <tr><th colspan="3">Total</th><th id="cart-total">—</th><th></th></tr>
            </tfoot>
          </table>
        </div>

        <form id="checkout-form" novalidate>
          <h3>Delivery details</h3>
          <div class="field">
            <label for="customer_name">Full name *</label>
            <input id="customer_name" name="customer_name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="customer_email">Email *</label>
            <input id="customer_email" name="customer_email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="customer_phone">Phone</label>
            <input id="customer_phone" name="customer_phone" autocomplete="tel">
          </div>
          <div class="field">
            <label for="delivery_address">Delivery address</label>
            <textarea id="delivery_address" name="delivery_address" rows="3"></textarea>
          </div>
          <div class="field">
            <label for="delivery_notes">Notes</label>
            <textarea id="delivery_notes" name="delivery_notes" rows="2"></textarea>
          </div>
          <p class="form-error" id="checkout-error" role="alert" hidden></p>
          <button class="btn btn-primary" type="submit" id="checkout-submit">Pay and place order</button>
          <p class="muted small">You will be redirected to a secure payment page.</p>
        </form>
      </div>
    </div>
  </section>

  <section id="track" class="section">
    <div class="container">
      <h2>Track your order</h2>
      <form id="track-form">
        <div class="field">
          <label for="track-order">Order number</label>
          <input id="track-order" name="order" placeholder="e.g. STK-ORD-2026-00001" required>
        </div>
        <div class="field">
          <label for="track-email">Email used on the order</label>
          <input id="track-email" name="email" type="email" required>
        </div>
        <button class="btn btn-ghost" type="submit">Track</button>
      </form>
      <div id="track-result" class="track-result" hidden></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; <span id="year"></span> {{business_name}}</p>
  </div>
</footer>

<script src="/shop.js" defer></script>
</body>
</html>
